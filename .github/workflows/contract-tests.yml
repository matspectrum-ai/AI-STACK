name: Contract Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install pinned direct dependencies
        run: bun install

      - name: Run domain tests
        id: domain_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun test tests/domain 2>&1 | tee /tmp/domain-tests.log

      - name: Run persistence tests
        id: persistence_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun test tests/persistence 2>&1 | tee /tmp/persistence-tests.log

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run check 2>&1 | tee /tmp/typecheck.log

      - name: Enforce contract checks
        if: always()
        shell: bash
        env:
          DOMAIN_OUTCOME: ${{ steps.domain_tests.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence_tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          sanitize_file() {
            local file="$1"
            if [ -f "$file" ]; then
              tail -n 30 "$file" \
                | tr '\n' ' ' \
                | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' \
                | cut -c1-4000
            fi
          }

          failed=0

          if [ "$DOMAIN_OUTCOME" != "success" ]; then
            echo "::error title=Domain tests failed::$(sanitize_file /tmp/domain-tests.log)"
            failed=1
          fi

          if [ "$PERSISTENCE_OUTCOME" != "success" ]; then
            echo "::error title=Persistence tests failed::$(sanitize_file /tmp/persistence-tests.log)"
            failed=1
          fi

          if [ "$TYPECHECK_OUTCOME" != "success" ]; then
            echo "::error title=Typecheck failed::$(sanitize_file /tmp/typecheck.log)"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
